name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # CI has no private denylist: this scans with the committed example
      # patterns plus the GUID heuristic (scripts/guid-allowlist.txt).
      - run: npm run scan
      # AM-60: the public demo build must compile, and its bundle guard proves the
      # demo transport/fixtures exist in dist-demo/ but never leak into dist/.
      - run: npm run build:demo --workspace=app/frontend
      - run: node app/frontend/scripts/check-demo-bundle.mjs
